<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Manutenção - Fama Flow</title>
    <!-- Bibliotecas Necessárias -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1E1E1E;
            --text-main: #FFFFFF;
            --text-sec: #A8A8A8;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --info: #3b82f6;
        }
        body {
            margin: 0; padding: 20px; font-family: 'Inter', sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            overflow-x: hidden;
        }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #333; padding-bottom: 15px; margin-bottom: 20px;
        }
        .header h1 { margin: 0; font-size: 2.5rem; display: flex; align-items: center; gap: 15px; }
        .clock { font-size: 2.5rem; font-weight: bold; color: var(--info); }
        
        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 20px;
        }
        
        .os-card {
            background-color: var(--surface-color); border-radius: 12px;
            padding: 25px; border-left: 10px solid var(--info);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; gap: 15px;
        }
        .os-card.urgente { border-left-color: var(--danger); animation: piscarBorda 2s infinite; }
        .os-card.parada { border-left-color: var(--danger); }
        .os-card.planejada { border-left-color: var(--warning); }

        @keyframes piscarBorda {
            0% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
            50% { box-shadow: 0 0 30px rgba(239, 68, 68, 0.8); }
            100% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
        }

        .os-header { display: flex; justify-content: space-between; font-size: 1.4rem; color: var(--text-sec); font-weight: bold;}
        .os-title { font-size: 2.2rem; font-weight: 900; margin: 0; line-height: 1.2; color: var(--text-main); }
        .os-desc { font-size: 1.3rem; color: var(--text-sec); margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .os-footer { display: flex; justify-content: space-between; align-items: center; font-size: 1.4rem; border-top: 1px solid #333; padding-top: 15px; margin-top: auto;}
        .badge { padding: 8px 20px; border-radius: 20px; font-weight: 900; font-size: 1.1rem; letter-spacing: 1px; }
        .bg-danger { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }
        .bg-warning { background-color: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid var(--warning); }
        
        body.alerta-nova-os { animation: piscarFundo 1s 3; }
        @keyframes piscarFundo { 0% { background-color: #450a0a; } 100% { background-color: var(--bg-color); } }
    </style>
</head>
<body>

    <div class="header">
        <h1><span class="material-icons" style="font-size: 3.5rem; color: var(--danger);">build</span> Fama Flow - Central de Manutenção</h1>
        <div class="clock" id="clock">00:00:00</div>
    </div>

    <div class="grid" id="os-container">
        <h2 style="color: var(--text-sec); text-align: center; width: 100%; grid-column: 1 / -1;">Conectando ao servidor...</h2>
    </div>

    <!-- Som de notificação padrão HTML5 -->
    <audio id="alert-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
// 1. Configuração do Supabase (Usando supabaseClient para evitar conflito)
        const SUPABASE_URL = 'https://flegnghsopbrulnnpuvz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsZWduZ2hzb3BicnVsbm5wdXZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI3NDc2MjMsImV4cCI6MjA3ODMyMzYyM30.oZN5gJyNemgYT8nKsXwK9y8cYY_SjLR-sfMqZeaOdQ4';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Atualiza relógio da TV
        setInterval(() => {
            document.getElementById('clock').textContent = new Date().toLocaleTimeString('pt-BR');
        }, 1000);

        // 2. Buscar Dados Iniciais
        async function loadActiveRequests() {
            const container = document.getElementById('os-container');
            
            // Busca requisições que não foram executadas nem rejeitadas
            const { data, error } = await supabaseClient
                .from('requests')
                .select('*')
                .eq('type', 'maintenance')
                .in('status', ['pending', 'pending_manager_check', 'planned'])
                .order('created_at', { ascending: true }); // Mais antigas primeiro

            if (error) {
                container.innerHTML = `<h2 style="color: var(--danger); text-align: center; grid-column: 1 / -1;">Erro ao carregar dados.</h2>`;
                return;
            }

            if (data.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh;">
                        <span class="material-icons" style="font-size: 100px; color: var(--success); margin-bottom: 20px;">check_circle</span>
                        <h1 style="color: var(--success); font-size: 3rem; margin: 0;">Nenhuma OS Pendente</h1>
                        <p style="color: var(--text-sec); font-size: 1.5rem;">Fábrica Operando 100%</p>
                    </div>`;
                return;
            }

            renderCards(data);
        }

        // 3. Renderizar os Cards na Tela
        function renderCards(requests) {
            const container = document.getElementById('os-container');
            let html = '';

            requests.forEach(req => {
                const reqData = req.data || {};
                const maquina = reqData.equipamento || 'Equipamento não informado';
                const setor = reqData.setor === 'Outra' ? reqData.setor_especificado : reqData.setor;
                const situacao = reqData.situacao_maquina || '';
                
                // Calcula tempo aberto
                const dataAbertura = new Date(req.created_at);
                const minutosAberto = Math.floor((new Date() - dataAbertura) / 60000);
                let tempoStr = minutosAberto > 60 ? `${Math.floor(minutosAberto/60)}h ${minutosAberto%60}m` : `${minutosAberto} min`;

                // Classes CSS condicionais
                let cardClass = 'os-card';
                let badgeClass = 'bg-warning';
                
                if (situacao.includes('parada') || situacao.includes('risco')) {
                    cardClass += ' parada urgente';
                    badgeClass = 'bg-danger';
                } else if (req.status === 'planned') {
                    cardClass += ' planejada';
                }

                html += `
                    <div class="${cardClass}" id="os-${req.id}">
                        <div class="os-header">
                            <span>#${req.id.substring(0,6).toUpperCase()}</span>
                            <span>${setor}</span>
                        </div>
                        <h3 class="os-title">${maquina}</h3>
                        <p class="os-desc">${reqData.descricao_problema || 'Sem descrição'}</p>
                        <div class="os-footer">
                            <span class="badge ${badgeClass}">${situacao.toUpperCase()}</span>
                            <span style="display:flex; align-items:center; gap:8px; font-weight: bold;">
                                <span class="material-icons">timer</span> ${tempoStr}
                            </span>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // 4. Configurar WebSockets (Atualização em Tempo Real)
        function setupRealtime() {
            supabaseClient.channel('public:requests')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'requests' }, payload => {
                    const req = payload.new;
                    
                    if (req && req.type === 'maintenance') {
                        if (payload.eventType === 'INSERT') {
                            tocarAlerta();
                        }
                        loadActiveRequests();
                    }
                })
                .subscribe();
        }

        function tocarAlerta() {
            const audio = document.getElementById('alert-sound');
            audio.play().catch(e => console.log("Áudio bloqueado pelo navegador."));
            document.body.classList.add('alerta-nova-os');
            setTimeout(() => document.body.classList.remove('alerta-nova-os'), 3000);
        }

        setInterval(loadActiveRequests, 60000);
        loadActiveRequests();
        setupRealtime();
    </script>
</body>
</html>
